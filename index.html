const L={easy:["🌱","Лёгкий","Для разминки"],medium:["🔥","Средний","Нужно подумать"],hard:["💎","Сложный","Для настоящих знатоков"]};
const N=10,$=document.getElementById("app");let st={};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hap=t=>{try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
const getB=k=>{try{return+localStorage.getItem("b_"+k)||0}catch(e){return 0}};
const setB=(k,v)=>{try{localStorage.setItem("b_"+k,v)}catch(e){}};
const put=h=>{$.style.animation="none";$.offsetHeight;$.style.animation="";$.innerHTML=h};
function topics(){
 put(`<h1>🎓 Викторина</h1><p class="sub">Выбери тему</p>`+Object.keys(T).map(k=>
 `<button class="card" onclick="levels('${k}')"><span class="ic">${T[k][0]}</span><span><b>${T[k][1]}</b><small>50 вопросов · 3 уровня</small></span></button>`).join(""))}
function levels(t){
 put(`<div class="top"><button class="back" onclick="topics()">←</button><h1 style="margin:0">${T[t][0]} ${T[t][1]}</h1></div><p class="sub">Выбери сложность</p>`+Object.keys(L).map(l=>{
 const b=getB(t+l);return `<button class="card" onclick="start('${t}','${l}')"><span class="ic">${L[l][0]}</span><span><b>${L[l][1]}</b><small>${L[l][2]}${b?" · рекорд "+b+"/"+N:""}</small></span></button>`}).join(""))}
function start(t,l){
 const qs=sh(D[t][l]).slice(0,N).map(s=>{const [q,c,...w]=s.split("|");return{q,c,o:sh([c,...w])}});
 st={t,l,qs,i:0,s:0,lock:false};show()}
function show(){
 const q=st.qs[st.i];
 put(`<div class="top"><button class="back" onclick="levels('${st.t}')">✕</button><div class="bar"><i style="width:${st.i/N*100}%"></i></div><span class="cnt">${st.i+1}/${N}</span></div>
 <div class="q">${q.q}</div>`+q.o.map((o,k)=>`<button class="opt" onclick="ans(this,${k})">${o}</button>`).join(""))}
function ans(b,k){
 if(st.lock)return;st.lock=true;
 const q=st.qs[st.i],ok=q.o[k]===q.c;
 document.querySelectorAll(".opt").forEach(e=>{if(e.textContent===q.c)e.classList.add("ok")});
 if(ok){st.s++;hap("success")}else{b.classList.add("bad");hap("error")}
 setTimeout(()=>{st.lock=false;st.i++;st.i<N?show():result()},1100)}
function result(){
 const p=st.s/N,key=st.t+st.l,old=getB(key),nb=st.s>old;if(nb)setB(key,st.s);
 const e=p>=.9?"🏆":p>=.6?"🎉":p>=.3?"🙂":"📚",stars="⭐".repeat(p>=.9?3:p>=.6?2:p>=.3?1:0)||"☆";
 const m=p>=.9?"Блестяще! Ты настоящий эксперт!":p>=.6?"Отличный результат!":p>=.3?"Неплохо, но можно лучше!":"Не сдавайся, попробуй ещё!";
 put(`<div class="res"><div class="big">${e}</div><div class="score">${st.s} / ${N}</div><div class="stars">${stars}</div>
 <p class="msg">${m}${nb&&st.s>0?"<br>🔥 Новый рекорд!":""}</p>
 <button class="btn" onclick="start('${st.t}','${st.l}')">Сыграть ещё раз</button>
 <button class="btn alt" onclick="levels('${st.t}')">Другая сложность</button>
 <button class="btn alt" onclick="topics()">Другая тема</button></div>`)}
topics();
</script></body></html>
